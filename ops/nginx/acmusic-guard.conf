# =============================================================================
# ACMUSIC · API 滥用防护 · http 级公共配置
#
# 部署位置：/etc/nginx/conf.d/acmusic-guard.conf
# 生效方式：/etc/nginx/nginx.conf 里已有 `include /etc/nginx/conf.d/*.conf;`
#           且在 `include /etc/nginx/sites-enabled/*;` 之前 → 本文件定义的
#           zone / map / log_format 可被 sites-enabled/music 直接引用。
#
# 为什么不写进 nginx.conf：该机器上还有 blog、guacamole 两个站点，
# 本文件只服务 music，不动全局文件可以避免波及他人。
#
# 修改后务必：nginx -t && nginx -s reload
# =============================================================================


# -----------------------------------------------------------------------------
# 1. 限流 zone
#
# 这两条是整个方案的主力：脚本、爬虫、下载器都有一个共同特征——单位时间内
# 的请求数远超真人。真人浏览的峰值大约是「详情页一次性并发 10-15 个接口」，
# 之后每秒 1-2 个；而一个 while 循环的脚本轻松几百 r/s。
#
# rate=15r/s + burst=40 的意义：允许瞬时 40 个请求（覆盖页面首屏并发），
# 之后按 15r/s 匀速放行，超出的直接 429。
#
# $binary_remote_addr 是二进制形式的客户端 IP，比 $remote_addr 省内存。
# 10m 大约能装 16 万个 IP，按当前访问量完全够用。
# -----------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=acmusic_api:10m   rate=15r/s;
limit_conn_zone $binary_remote_addr zone=acmusic_conn:10m;

# 音频代理单独一套额度：它不按次数算成本，按字节算。
# 一个人连 6 条音频流拉满带宽，比打一万次 search 更伤钱包。
limit_req_zone  $binary_remote_addr zone=acmusic_audio:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=acmusic_audioc:10m;

# 被限流时返回 429（默认 503）。429 语义明确，也方便前端/排查时区分
# 「被自己限流」和「上游挂了」。
limit_req_status  429;
limit_conn_status 429;


# -----------------------------------------------------------------------------
# 2. 只读接口的短缓存（挡「同一关键词被并发刷」）
#
# 动机：网易云的风控是按「我们的服务器出口 IP + 接口」算的。实测 25 个并发
# 打 /api/search 就能让该接口对全站返回 405「操作频繁」，60 秒才恢复。
# 也就是说，攻击者甚至不需要跑流量，只要把某个接口刷到节流，全站用户一起挂。
#
# 这里对三个纯只读、无个性化的接口做 60 秒缓存：
#   - 命中缓存 → 不打 Node、不打网易 → 刷不出伤害
#   - proxy_cache_lock → 同一个 key 并发回源只放行 1 个，其余等结果
#
# 为什么不缓存别的接口：NeteaseCloudMusicApi 里大量「写操作」是 GET 实现的
# （点赞 /like、收藏 /playlist/tracks、关注 /follow …）。一旦缓存，用户会
# 看到「点了没反应」，而且可能是别人的结果。所以白名单只放这三个。
# -----------------------------------------------------------------------------
proxy_cache_path /var/cache/nginx/acmusic levels=1:2 keys_zone=acmusic_cache:20m
                 max_size=512m inactive=10m use_temp_path=off;

# 是否绕过缓存。source 把 cookie 参数和 URI 拼在一起判断，一个 map 同时表达
# 两个条件：
#   - 带了 ?cookie=... → 登录态个性化请求 → 既不读缓存也不写缓存（default 1）
#   - 没有 cookie 且 URI 命中白名单 → 可缓存（0）
# 注意正则用 $ 结尾锚定，避免 /api/search 顺带匹配到 /api/search/match 之类。
map "$arg_cookie$uri" $acmusic_cache_bypass {
    default                                                 1;
    "~^/api/(search|cloudsearch|song/detail)$"              0;
}


# -----------------------------------------------------------------------------
# 3. 日志脱敏：抹掉 URL 里的 cookie 参数
#
# 这是个跟「防滥用」无关、但优先级更高的问题：
# 前端把登录态显式拼在 query 上（?cookie=MUSIC_U%3D...，见 src/config.js 的
# passthroughCookie），nginx 的默认日志格式会把整条 URL 原样落盘。
# 于是 access.log 里躺着完整的 MUSIC_U —— 那串东西等价于账号密码，拿到就能
# 冒充登录（改昵称、删歌单、看私信）。实测当前日志里已经有大量这种记录。
#
# 这里在写日志前把 cookie 的值替换成 REDACTED，其他参数原样保留，
# 排查问题（关键词、歌曲 ID、分页）都不受影响。
# -----------------------------------------------------------------------------
map $request_uri $acmusic_safe_uri {
    default                                            $request_uri;
    "~^(?<ac_pre>.*[?&]cookie=)(?<ac_ck>[^&]*)(?<ac_post>.*)$"
                                                       "${ac_pre}REDACTED${ac_post}";
}

log_format acmusic_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $acmusic_safe_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
