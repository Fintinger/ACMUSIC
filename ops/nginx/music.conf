# ACMUSIC · music.archai.space
# 与 blog / guacamole 共存：仅新增站点，不改 nginx.conf 与其他站点
#
# ---------------------------------------------------------------------------
# 2026-10-28 变更：API 滥用防护（L1 CORS 收紧 / L2 限流+音频限速）
# 依赖两个新增文件：
#   /etc/nginx/conf.d/acmusic-guard.conf        zone / map / log_format 定义
#   /etc/nginx/snippets/acmusic-api-common.conf /api/ 系列 location 的公共片段
# 仓库内对应 ops/nginx/ 下同名文件。
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name music.archai.space;

    # ACME 续期验证必须留在 80
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/music;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    # 80 上的请求九成是扫描器和裸 IP 探测，同样用脱敏格式记日志
    access_log /var/log/nginx/music.access.log acmusic_safe;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music.archai.space;

    ssl_certificate     /etc/letsencrypt/live/music.archai.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.archai.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/music;
    index index.html;
    charset utf-8;

    # 不在响应头和错误页里暴露 nginx 版本号（原来是 nginx/1.24.0 (Ubuntu)）
    server_tokens off;

    # 网易云 CDN 有相当一部分图片返回 http://（如 toplist/detail、playlist/detail 的 coverImgUrl），
    # 页面是 https 时会被浏览器判定为混合内容（地址栏"不安全"+ 图像可被篡改提示）。
    # 实测这些 CDN 域名 https 可用，这里让浏览器把 http 子资源统一升级到 https。
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # -----------------------------------------------------------------------
    # /api/ 根路径：上游会返回一个空 200，没有存在意义，直接 404 减指纹
    # （精确匹配，优先于下面的前缀 location）
    # -----------------------------------------------------------------------
    location = /api/ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # 音频流代理 —— 精确匹配，优先于下面的 /api/ 前缀
    #
    # 这是全站唯一「按字节烧钱」的入口：单个请求最多能拉 64MB，而且是持续
    # 流式输出。别人写个循环拿它批量下歌，跑的全是你的出口带宽。
    # 所以这里三层限制叠着上：请求频率、并发连接数、单连接速率。
    # -----------------------------------------------------------------------
    location = /api/audio-proxy {
        limit_req  zone=acmusic_audio burst=8 nodelay;
        limit_conn acmusic_audioc 8;

        # 前 2MB 不限速 —— 保证起播、拖动进度条 seek 的即时感；
        # 之后按 4MB/s 封顶。无损/96kHz 24bit 实际码率约 0.5-1MB/s，
        # 有 4 倍余量，正常听歌完全感知不到，但批量下载会被卡死。
        limit_rate_after 2m;
        limit_rate 4m;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # IP 归属地查询 —— 精确匹配，转给辅助服务
    # -----------------------------------------------------------------------
    location = /api/ip-location {
        limit_req  zone=acmusic_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3001/ip-location;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # -----------------------------------------------------------------------
    # 只读接口的 60 秒短缓存（挡「同一接口被并发刷」）
    #
    # 为什么单独拎出来：网易的风控按「服务器出口 IP + 接口」算，实测 25 个
    # 并发打 /api/search 就能让该接口对全站返回 405「操作频繁」，约 60 秒
    # 才恢复。攻击者不需要跑流量，把某个接口刷到节流就能让所有人一起挂。
    # 命中缓存后不再回源，刷不出伤害；proxy_cache_lock 保证同一 key 并发
    # 回源只放行 1 个，其余等结果。
    #
    # 只放这三个纯只读、无个性化的接口。NeteaseCloudMusicApi 里大量「写操作」
    # 是 GET 实现的（/like、/playlist/tracks、/follow …），误缓存会导致
    # 「点了没反应」，所以白名单必须窄。
    #
    # 用 ^~ 前缀而不是正则 location：正则 location 里 proxy_pass 不允许带 URI，
    # 而 ^~ 前缀允许，可以用 /search 替换掉 /api/search，转发路径和后端一致。
    # -----------------------------------------------------------------------
    location ^~ /api/search {
        include /etc/nginx/snippets/acmusic-api-common.conf;

        proxy_cache           acmusic_cache;
        proxy_cache_key       "$scheme$host$request_uri";
        proxy_cache_valid     200 60s;
        proxy_cache_lock      on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass    $acmusic_cache_bypass;
        proxy_no_cache        $acmusic_cache_bypass;
        add_header X-Cache-Status $upstream_cache_status always;

        # 上游会顺带下发 set-cookie: NMTID=...（匿名设备指纹）。一旦被缓存，
        # 后来的用户会收到别人的设备 ID —— 既脏又可能让风控把多人当成同一设备。
        # 这三个接口不需要维持会话，直接丢弃。
        proxy_hide_header Set-Cookie;
        # hide 只影响「发给浏览器」的头，缓存判定看的仍是上游原始响应 ——
        # 带 Set-Cookie 的响应 nginx 默认拒绝入缓存（实测一直 MISS）。
        # ignore 掉它之后才会真的写缓存，而 set-cookie 依旧不会漏给客户端。
        # 同理 ignore Cache-Control/Expires，缓存时长以 proxy_cache_valid 为准。
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        proxy_pass http://127.0.0.1:3000/search;
    }

    location ^~ /api/cloudsearch {
        include /etc/nginx/snippets/acmusic-api-common.conf;

        proxy_cache           acmusic_cache;
        proxy_cache_key       "$scheme$host$request_uri";
        proxy_cache_valid     200 60s;
        proxy_cache_lock      on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass    $acmusic_cache_bypass;
        proxy_no_cache        $acmusic_cache_bypass;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_hide_header Set-Cookie;
        # hide 只影响「发给浏览器」的头，缓存判定看的仍是上游原始响应 ——
        # 带 Set-Cookie 的响应 nginx 默认拒绝入缓存（实测一直 MISS）。
        # ignore 掉它之后才会真的写缓存，而 set-cookie 依旧不会漏给客户端。
        # 同理 ignore Cache-Control/Expires，缓存时长以 proxy_cache_valid 为准。
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        proxy_pass http://127.0.0.1:3000/cloudsearch;
    }

    location ^~ /api/song/detail {
        include /etc/nginx/snippets/acmusic-api-common.conf;

        proxy_cache           acmusic_cache;
        proxy_cache_key       "$scheme$host$request_uri";
        proxy_cache_valid     200 60s;
        proxy_cache_lock      on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass    $acmusic_cache_bypass;
        proxy_no_cache        $acmusic_cache_bypass;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_hide_header Set-Cookie;
        # hide 只影响「发给浏览器」的头，缓存判定看的仍是上游原始响应 ——
        # 带 Set-Cookie 的响应 nginx 默认拒绝入缓存（实测一直 MISS）。
        # ignore 掉它之后才会真的写缓存，而 set-cookie 依旧不会漏给客户端。
        # 同理 ignore Cache-Control/Expires，缓存时长以 proxy_cache_valid 为准。
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        proxy_pass http://127.0.0.1:3000/song/detail;
    }

    # -----------------------------------------------------------------------
    # 网易云 API —— 剥掉 /api 前缀后转给 3000
    # -----------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/acmusic-api-common.conf;

        proxy_pass http://127.0.0.1:3000/;
    }

    # -----------------------------------------------------------------------
    # 漏洞扫描器的固定靶子：/.env、/.git/config、phpinfo.php、wp-login.php…
    # 实测 24 小时内有 554 次这类探测（两台 GCP 主机）。
    #
    # 这些路径原本会落进 SPA 回退，返回 200 + index.html —— 扫描器看到 200
    # 会认定「文件存在」，于是换着变体继续挖（/.env.bak、/.env.local…）。
    # 这里直接 404，既断掉这条探测线，也不让它们污染访问日志。
    #
    # 必须写在静态资源正则之前：nginx 的正则 location 按书写顺序取首个命中。
    # 不拦 /.well-known/（ACME 续期要用）。
    # -----------------------------------------------------------------------
    location ~* /(\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.DS_Store|wp-admin|wp-login|wp-content|wp-includes|xmlrpc|phpinfo|phpmyadmin|\.sql$|\.bak$) {
        access_log off;
        return 404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|webp|svg|ico|gif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 用脱敏格式：URL 里的 ?cookie=MUSIC_U%3D... 会被替换成 REDACTED
    # （登录态 token 等价于账号密码，不该明文躺在日志里）
    access_log /var/log/nginx/music.access.log acmusic_safe;
    error_log  /var/log/nginx/music.error.log;
}
