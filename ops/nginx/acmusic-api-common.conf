# =============================================================================
# ACMUSIC · 通用 API 代理片段（被 music 站点里所有 /api/ 系列 location include）
#
# 部署位置：/etc/nginx/snippets/acmusic-api-common.conf
# 内容只包含「每个 API location 都要有的东西」，不含 proxy_pass ——
# 因为每个 location 的转发目标和缓存策略不同，那部分各自写在站点配置里。
# =============================================================================

# -----------------------------------------------------------------------------
# L1 · CORS 收紧
#
# 上游 NeteaseCloudMusicApi 用的是 cors() 默认策略：对**任意** Origin 原样回显
# （实测 Origin: https://evil.example.com 会被 204 + 原样反射回去）。
# 后果是别人的网页可以在浏览器里直接 fetch 本站接口、读走完整响应 ——
# 等于把 API 变成一个公开的跨域数据源，任何人写个前端页面就能拿去用。
#
# 这里把上游的头全部剥掉，换成固定自家源：
#   - 本站 SPA 是同源请求，本来就不看这些头 → 前端零改动
#   - 别人的跨域页面会因 Allow-Origin 不匹配被浏览器拦下
# 以后如果要在别的域（比如本地 8080 直连）调，把该源加进下面这行。
# -----------------------------------------------------------------------------
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
add_header Access-Control-Allow-Origin "https://music.archai.space" always;

# 顺手隐藏后端指纹（默认会回 X-Powered-By: Express）
proxy_hide_header X-Powered-By;

# 跨域预检：本站同源请求不会触发 preflight，所以 OPTIONS 只可能来自跨域调用方。
# 统一 204，不再把请求转给上游去反射 Origin。
if ($request_method = OPTIONS) { return 204; }

# -----------------------------------------------------------------------------
# L2 · 按 IP 限流
#
# 额度定义在 /etc/nginx/conf.d/acmusic-guard.conf：
#   acmusic_api  = 15 r/s，burst 40
# burst 40 是为了覆盖「详情页首屏一次性并发 10-15 个接口」的正常峰值；
# nodelay 表示这 40 个立即放行，不做排队延迟（否则首屏会明显变慢）。
# -----------------------------------------------------------------------------
limit_req  zone=acmusic_api burst=40 nodelay;
limit_conn acmusic_conn 20;

# -----------------------------------------------------------------------------
# 代理基础设置（沿用原配置，勿随意调整）
# -----------------------------------------------------------------------------
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 网易云会把 163 下发的整批 cookie 原样透传，响应头峰值可达 4164 字节，
# 默认 4k 缓冲会触发 "upstream sent too big header" → 502（扫码/匿名/手机号登录都会中招）
proxy_buffer_size    16k;
proxy_buffers        8 16k;
proxy_busy_buffers_size 32k;

proxy_read_timeout 60s;
proxy_send_timeout 60s;
